<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mGoldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D6" />
      <stop offset="45%" stop-color="#DEBF7D" />
      <stop offset="100%" stop-color="#B38938" />
    </linearGradient>
    <linearGradient id="mGoldDeep" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C6622" />
      <stop offset="60%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#F5DC9E" />
    </linearGradient>
    <linearGradient id="mOxblood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#370C15" />
      <stop offset="50%" stop-color="#24060C" />
      <stop offset="100%" stop-color="#140206" />
    </linearGradient>
    <radialGradient id="mGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#DEBF7D" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Shield Badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#mOxblood)" stroke="url(#mGoldDeep)" stroke-width="1.5" />
  <rect x="6" y="6" width="52" height="52" rx="10" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" />

  <!-- Ambient Glow -->
  <circle cx="32" cy="24" r="16" fill="url(#mGlow)" />

  <!-- Monogram M Pillars -->
  <path d="M16 46V22L24 33V46H16Z" fill="url(#mGoldDeep)" />
  <path d="M48 46V22L40 33V46H48Z" fill="url(#mGoldDeep)" />
  <path d="M24 33L32 44L40 33L32 22L24 33Z" fill="url(#mGoldLight)" />

  <!-- Guiding Torch Beacon ("Mashaal") -->
  <path d="M32 10C32 10 37 15 37 19.5C37 22.5 34.8 24.5 32 24.5C29.2 24.5 27 22.5 27 19.5C27 15 32 10 32 10Z" fill="url(#mGoldLight)" />
  <path d="M32 15C32 15 34.5 18 34.5 20.2C34.5 21.8 33.4 22.8 32 22.8C30.6 22.8 29.5 21.8 29.5 20.2C29.5 18 32 15 32 15Z" fill="#FFFFFF" fill-opacity="0.85" />

  <!-- Base Pedestal -->
  <rect x="18" y="49" width="28" height="2" rx="1" fill="url(#mGoldLight)" />
