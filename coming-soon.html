<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon | Mashaal Groups</title>
  <meta name="description" content="Site will coming soon - Mashaal Groups">

  <link rel="stylesheet" href="css/design-system.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden; /* Strictly no scroll */
      background: linear-gradient(105deg, #1d0309 0%, #28070e 45%, #380b14 100%);
      font-family: var(--font-sans, 'Plus Jakarta Sans', sans-serif);
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* Ambient animated lighting orbs */
    .glow-sphere {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 1;
    }

    .glow-1 {
      top: 15%;
      left: 20%;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(160, 32, 54, 0.45) 0%, transparent 70%);
      animation: pulseSphere 8s ease-in-out infinite alternate;
    }

    .glow-2 {
      bottom: 10%;
      right: 20%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(197, 160, 89, 0.25) 0%, transparent 70%);
      animation: pulseSphere 10s ease-in-out infinite alternate-reverse;
    }

    @keyframes pulseSphere {
      0% { transform: scale(0.9) translate(0, 0); opacity: 0.5; }
      50% { transform: scale(1.18) translate(30px, -20px); opacity: 0.9; }
      100% { transform: scale(0.95) translate(-20px, 20px); opacity: 0.6; }
    }

    /* Top Bar */
    .cs-topbar {
      padding: 2rem 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 10;
    }

    .cs-logo {
      font-family: var(--font-serif-brand, 'Cinzel', serif);
      font-size: 1.15rem;
      letter-spacing: 0.2em;
      color: #FFFFFF;
      text-decoration: none;
      text-transform: uppercase;
      font-weight: 600;
    }

    .cs-back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: color 0.3s ease, transform 0.3s ease;
    }

    .cs-back-btn:hover {
      color: #FFFFFF;
      transform: translateX(-4px);
    }

    /* Center Stage - strictly fits screen without scrolling */
    .cs-center {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 1.5rem;
    }

    /* Animated Pulsing Radar Rings */
    .radar-container {
      position: relative;
      width: 110px;
      height: 110px;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .radar-ring {
      position: absolute;
      border: 1px solid rgba(197, 160, 89, 0.4);
      border-radius: 50%;
      animation: radarWave 3s cubic-bezier(0.1, 0.5, 0.4, 1) infinite;
    }

    .radar-ring:nth-child(2) {
      animation-delay: 1s;
    }

    .radar-ring:nth-child(3) {
      animation-delay: 2s;
    }

    .radar-core {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: radial-gradient(circle, #DEBF7D 0%, #782030 100%);
      box-shadow: 0 0 25px rgba(222, 191, 125, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
      animation: coreGlow 2.5s ease-in-out infinite alternate;
    }

    @keyframes radarWave {
      0% { width: 40px; height: 40px; opacity: 1; transform: scale(1); }
      100% { width: 140px; height: 140px; opacity: 0; transform: scale(1.6); }
    }

    @keyframes coreGlow {
      0% { box-shadow: 0 0 15px rgba(222, 191, 125, 0.6); transform: scale(0.95); }
      100% { box-shadow: 0 0 35px rgba(222, 191, 125, 1); transform: scale(1.05); }
    }

    /* Brand Name */
    .cs-brand-tag {
      font-family: var(--font-serif-brand, 'Cinzel', serif);
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      color: var(--accent-gold, #C5A059);
      text-transform: uppercase;
      margin-bottom: 0.9rem;
      opacity: 0.9;
    }

    /* Target Announcement Text with Animated Shimmer */
    .cs-headline {
      font-family: var(--font-serif-brand, 'Cinzel', serif);
      font-size: clamp(2.4rem, 6vw, 4.4rem);
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      line-height: 1.15;
      margin-bottom: 1.2rem;
      background: linear-gradient(135deg, #FFFFFF 20%, #E7DCD3 50%, #C5A059 80%, #FFFFFF 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: textShimmer 4s linear infinite;
    }

    @keyframes textShimmer {
      to { background-position: 200% center; }
    }

    /* Elegant Sub-indicator */
    .cs-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.45rem 1.4rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 100px;
      font-size: 0.76rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(10px);
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #C5A059;
      box-shadow: 0 0 10px #C5A059;
      animation: blinkDot 1.6s ease-in-out infinite;
    }

    @keyframes blinkDot {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* Footer - Fixed at bottom */
    .cs-bottombar {
      padding: 1.8rem 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 10;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.4);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    @media (max-width: 640px) {
      .cs-topbar, .cs-bottombar {
        padding: 1.5rem;
      }
      .cs-bottombar {
        flex-direction: column;
        gap: 0.5rem;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <div class="glow-sphere glow-1"></div>
  <div class="glow-sphere glow-2"></div>

  <!-- Top bar -->
  <header class="cs-topbar">
    <a href="index.html" class="cs-logo">MASHAAL GROUPS</a>
    <a href="index.html" class="cs-back-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>Back</span>
    </a>
  </header>

  <!-- Center Announcement -->
  <main class="cs-center">
    <div class="radar-container">
      <div class="radar-ring"></div>
      <div class="radar-ring"></div>
      <div class="radar-ring"></div>
      <div class="radar-core">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
      </div>
    </div>

    <div class="cs-brand-tag" id="divisionTag">MASHAAL FOODS</div>
    <h1 class="cs-headline">SITE WILL COMING SOON</h1>
    
    <div class="cs-status-pill">
      <span class="pulse-dot"></span>
      <span>OFFICIAL LAUNCH IN PROGRESS</span>
    </div>
  </main>

  <!-- Bottom bar -->
  <footer class="cs-bottombar">
    <div>&copy; 2026 Mashaal Groups. All rights reserved.</div>
    <div>Built for a stronger tomorrow.</div>
  </footer>

  <script>
    const divisions = {
      foods: "MASHAAL FOODS",
      rentacar: "MASHAAL RENT A CAR"
    };

    const params = new URLSearchParams(window.location.search);
    const key = params.get('b') || 'foods';
    const name = divisions[key] || "MASHAAL ENTERPRISE";

    document.getElementById('divisionTag').textContent = name;
    document.title = `${name} | SITE WILL COMING SOON`;
  </script>
</body>
</html>
